<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ESP32 Motor Control</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;600;800&display=swap');

  :root {
    --bg:       #0a0c10;
    --panel:    #111318;
    --border:   #1e2230;
    --accent-a: #00e5ff;
    --accent-b: #ff3d71;
    --green:    #39ff14;
    --dim:      #3a3f52;
    --text:     #c8d0e8;
    --text-dim: #555c78;
    --radius:   8px;
    --font-mono:'Share Tech Mono', monospace;
    --font-ui:  'Barlow Condensed', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Toda la UI ocupa exactamente la pantalla, sin scroll ── */
  html, body {
    height: 100%;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    height: 100dvh;          /* dynamic viewport: descuenta barra Chrome */
    display: flex;
    flex-direction: column;
    padding: 8px 10px;
    gap: 6px;
    background-image:
      repeating-linear-gradient(0deg,  transparent,transparent 39px,#ffffff04 39px,#ffffff04 40px),
      repeating-linear-gradient(90deg, transparent,transparent 39px,#ffffff04 39px,#ffffff04 40px);
  }

  /* ═══ TOP BAR ═══ */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .logo {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 3px;
  }
  .logo span { color: var(--accent-a); }

  #status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 100px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 1px;
    transition: border-color .3s, color .3s;
  }
  #status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--dim);
    transition: background .3s, box-shadow .3s;
    flex-shrink: 0;
  }
  #status-pill.connected { border-color: var(--green); color: var(--green); }
  #status-pill.connected #status-dot {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: blink 1.8s ease-in-out infinite;
  }
  #status-pill.error { border-color: var(--accent-b); color: var(--accent-b); }
  #status-pill.error #status-dot { background: var(--accent-b); }

  @keyframes blink {
    0%,100% { box-shadow: 0 0 4px var(--green); }
    50%      { box-shadow: 0 0 14px var(--green); }
  }

  /* ═══ MAIN LAYOUT — crece para llenar el espacio disponible ═══ */
  .main-layout {
    flex: 1;               /* ocupa todo lo que sobre tras topbar y log */
    min-height: 0;         /* permite que flex-child se encoja */
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 8px;
    align-items: stretch;
  }

  /* ═══ MOTOR CARD ═══ */
  .motor-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-height: 0;
    transition: border-color .3s, box-shadow .3s;
  }
  .motor-card.active-fwd { border-color: var(--accent-a); box-shadow: 0 0 20px #00e5ff1a; }
  .motor-card.active-bck { border-color: var(--accent-b); box-shadow: 0 0 20px #ff3d711a; }

  .motor-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--text-dim);
    text-transform: uppercase;
    flex-shrink: 0;
    transition: color .2s;
  }
  .motor-card.active-fwd .motor-title { color: var(--accent-a); }
  .motor-card.active-bck .motor-title { color: var(--accent-b); }

  .motor-state {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--text-dim);
    flex-shrink: 0;
    transition: color .2s;
  }
  .motor-card.active-fwd .motor-state { color: var(--accent-a); }
  .motor-card.active-bck .motor-state { color: var(--accent-b); }

  /* ═══ ARROW BUTTONS — crecen para llenar la card ═══ */
  .btn-motor {
    flex: 1;               /* cada flecha ocupa la mitad del espacio libre */
    min-height: 0;
    width: 100%;
    padding: 0;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s;
  }
  .btn-motor:disabled { opacity: .2; cursor: not-allowed; }
  .btn-motor:active:not(:disabled) { transform: scale(.92); }

  /* SVG escala con el contenedor */
  .arrow-svg {
    width: 100%;
    height: 100%;
    max-height: 100%;
    transition: filter .2s;
  }

  .btn-fwd .arrow-svg { fill: #1a2a30; stroke: #00e5ff55; stroke-width: 2; }
  .btn-fwd.pressed .arrow-svg {
    fill: #003a45;
    stroke: var(--accent-a);
    filter: drop-shadow(0 0 10px #00e5ffaa);
  }

  .btn-bck .arrow-svg { fill: #2a1a20; stroke: #ff3d7155; stroke-width: 2; }
  .btn-bck.pressed .arrow-svg {
    fill: #3a0018;
    stroke: var(--accent-b);
    filter: drop-shadow(0 0 10px #ff3d71aa);
  }

  .arrow-label { fill: var(--text-dim); transition: fill .2s; }
  .btn-fwd.pressed .arrow-label { fill: var(--accent-a); }
  .btn-bck.pressed .arrow-label { fill: var(--accent-b); }

  /* ═══ CENTER COLUMN ═══ */
  .center-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  #btn-connect {
    width: 68px; height: 68px;
    border-radius: 50%;
    border: 2px solid var(--accent-a);
    background: transparent;
    color: var(--accent-a);
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: all .25s;
    flex-shrink: 0;
  }
  #btn-connect:hover:not(:disabled) { background: #00e5ff15; box-shadow: 0 0 20px #00e5ff44; }
  #btn-connect:disabled { border-color: var(--dim); color: var(--dim); cursor: not-allowed; }
  .btn-connect-icon { font-size: 20px; line-height: 1; }

  #btn-disconnect {
    width: 60px; height: 60px;
    border-radius: 50%;
    border: 1px solid #ff3d7166;
    background: transparent;
    color: #ff3d7188;
    font-family: var(--font-mono);
    font-size: 8px;
    letter-spacing: 1px;
    cursor: pointer;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    transition: all .2s;
    display: none;
    flex-shrink: 0;
  }
  #btn-disconnect:hover { border-color: var(--accent-b); color: var(--accent-b); background: #ff3d7110; }
  .disconnect-icon { font-size: 16px; }

  /* ═══ LOG — altura fija pequeña, no crece ═══ */
  #log-wrap {
    flex-shrink: 0;
  }
  .log-title {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 3px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  #log {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 10px;
    height: 56px;          /* compacto en landscape */
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 10px;
    line-height: 1.7;
  }
  #log .entry { display: flex; gap: 8px; }
  #log .ts       { color: #2a2f42; flex-shrink: 0; }
  #log .msg-ok   { color: var(--green); }
  #log .msg-err  { color: var(--accent-b); }
  #log .msg-info { color: var(--accent-a); }

  /* ═══ LANDSCAPE: log aún más compacto si la altura es poca ═══ */
  @media (max-height: 420px) {
    body { padding: 4px 8px; gap: 4px; }
    .topbar { display: none; }   /* ocultar header en landscape muy estrecho */
    #log { height: 40px; }
    .motor-title { font-size: 10px; letter-spacing: 2px; }
    #btn-connect { width: 54px; height: 54px; font-size: 7px; }
    #btn-connect .btn-connect-icon { font-size: 16px; }
    #btn-disconnect { width: 46px; height: 46px; }
  }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo"><span>//</span> ESP32-C3 · L298N</div>
  <div id="status-pill">
    <div id="status-dot"></div>
    <span id="status-text">DESCONECTADO</span>
  </div>
</div>

<!-- MAIN: Motor A | Center | Motor B -->
<div class="main-layout">

  <!-- ── MOTOR A ── -->
  <div class="motor-card" id="card-a">
    <div class="motor-title">MOTOR A</div>
    <div class="motor-state" id="state-a">PARADO</div>

    <!-- Flecha arriba (avance) -->
    <button class="btn-motor btn-fwd" id="btn-a-fwd" disabled data-motor="a" data-dir="fwd">
      <svg class="arrow-svg" viewBox="0 0 110 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" stroke-linejoin="round">
        <polygon points="55,4 100,48 76,48 76,96 34,96 34,48 10,48"/>
        <text class="arrow-label" x="55" y="80" text-anchor="middle" font-size="11" font-family="monospace" letter-spacing="1">AVANCE</text>
      </svg>
    </button>

    <!-- Flecha abajo (retroceso) -->
    <button class="btn-motor btn-bck" id="btn-a-bck" disabled data-motor="a" data-dir="bck">
      <svg class="arrow-svg" viewBox="0 0 110 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" stroke-linejoin="round">
        <polygon points="55,96 10,52 34,52 34,4 76,4 76,52 100,52"/>
        <text class="arrow-label" x="55" y="38" text-anchor="middle" font-size="11" font-family="monospace" letter-spacing="1">RETRO</text>
      </svg>
    </button>
  </div>

  <!-- ── CENTER COLUMN ── -->
  <div class="center-col">
    <button id="btn-connect">
      <span class="btn-connect-icon">⬡</span>
      CONECTAR
    </button>
    <button id="btn-disconnect">
      <span class="disconnect-icon">✕</span>
      SALIR
    </button>
  </div>

  <!-- ── MOTOR B ── -->
  <div class="motor-card" id="card-b">
    <div class="motor-title">MOTOR B</div>
    <div class="motor-state" id="state-b">PARADO</div>

    <button class="btn-motor btn-fwd" id="btn-b-fwd" disabled data-motor="b" data-dir="fwd">
      <svg class="arrow-svg" viewBox="0 0 110 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" stroke-linejoin="round">
        <polygon points="55,4 100,48 76,48 76,96 34,96 34,48 10,48"/>
        <text class="arrow-label" x="55" y="80" text-anchor="middle" font-size="11" font-family="monospace" letter-spacing="1">AVANCE</text>
      </svg>
    </button>

    <button class="btn-motor btn-bck" id="btn-b-bck" disabled data-motor="b" data-dir="bck">
      <svg class="arrow-svg" viewBox="0 0 110 100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" stroke-linejoin="round">
        <polygon points="55,96 10,52 34,52 34,4 76,4 76,52 100,52"/>
        <text class="arrow-label" x="55" y="38" text-anchor="middle" font-size="11" font-family="monospace" letter-spacing="1">RETRO</text>
      </svg>
    </button>
  </div>

</div>

<!-- LOG -->
<div id="log-wrap">
  <div class="log-title">// consola</div>
  <div id="log"></div>
</div>

<script>
  // ── UUIDs (deben coincidir con el sketch) ──────────────────
  const SERVICE_UUID     = '12345678-1234-1234-1234-123456789abc';
  const CHAR_UUIDS = {
    'a-fwd': 'aaaaaaaa-0000-1000-8000-00805f9b34fb',
    'a-bck': 'aaaaaaab-0000-1000-8000-00805f9b34fb',
    'b-fwd': 'aaaaaaac-0000-1000-8000-00805f9b34fb',
    'b-bck': 'aaaaaaad-0000-1000-8000-00805f9b34fb',
  };

  // ── Estado ─────────────────────────────────────────────────
  let device = null;
  let server = null;
  let chars  = {};   // { 'a-fwd': BLECharacteristic, ... }

  // Estado activo por motor: null | 'fwd' | 'bck'
  const motorState = { a: null, b: null };

  // ── DOM refs ───────────────────────────────────────────────
  const btnConnect    = document.getElementById('btn-connect');
  const btnDisconnect = document.getElementById('btn-disconnect');
  const statusPill    = document.getElementById('status-pill');
  const statusText    = document.getElementById('status-text');
  const logEl         = document.getElementById('log');

  const motorBtns = document.querySelectorAll('.btn-motor');

  // ── Log helper ─────────────────────────────────────────────
  function log(msg, type = 'info') {
    const ts   = new Date().toLocaleTimeString('es', { hour12: false });
    const div  = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `<span class="ts">${ts}</span><span class="msg-${type}">${msg}</span>`;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ── UI helpers ─────────────────────────────────────────────
  function setStatus(state, text) {
    statusPill.className = state;
    statusText.textContent = text;
  }

  function setMotorUI(motor, dir) {
    // dir: 'fwd' | 'bck' | null
    motorState[motor] = dir;
    const card  = document.getElementById(`card-${motor}`);
    const state = document.getElementById(`state-${motor}`);
    const fwdBtn = document.getElementById(`btn-${motor}-fwd`);
    const bckBtn = document.getElementById(`btn-${motor}-bck`);

    card.classList.remove('active-fwd', 'active-bck');
    fwdBtn.classList.remove('pressed');
    bckBtn.classList.remove('pressed');

    if (dir === 'fwd') {
      card.classList.add('active-fwd');
      fwdBtn.classList.add('pressed');
      state.textContent = '▲ AVANZANDO';
    } else if (dir === 'bck') {
      card.classList.add('active-bck');
      bckBtn.classList.add('pressed');
      state.textContent = '▼ RETROCEDIENDO';
    } else {
      state.textContent = 'PARADO';
    }
  }

  function enableButtons(enabled) {
    motorBtns.forEach(b => b.disabled = !enabled);
    btnDisconnect.style.display = enabled ? 'block' : 'none';
    btnConnect.style.display    = enabled ? 'none'  : 'block';
  }

  // ── Enviar valor a una característica ─────────────────────
  async function writeChar(key, value) {
    if (!chars[key]) { log(`Característica ${key} no disponible`, 'err'); return; }
    const encoder = new TextEncoder();
    await chars[key].writeValueWithoutResponse(encoder.encode(value));
  }

  // ── Lógica press / release ───────────────────────────────
  async function motorPress(motor, dir) {
    // Si había otra dirección activa en este motor, pararla primero
    if (motorState[motor] && motorState[motor] !== dir) {
      await writeChar(`${motor}-${motorState[motor]}`, '0');
    }
    await writeChar(`${motor}-${dir}`, '1');
    setMotorUI(motor, dir);
    const label = dir === 'fwd' ? 'AVANCE' : 'RETROCESO';
    log(`Motor ${motor.toUpperCase()} → ${label}`, 'ok');
  }

  async function motorRelease(motor, dir) {
    if (motorState[motor] !== dir) return;  // ya fue cancelado por otro evento
    await writeChar(`${motor}-${dir}`, '0');
    setMotorUI(motor, null);
    log(`Motor ${motor.toUpperCase()} → STOP`, 'ok');
  }

  // ── Conectar BLE ───────────────────────────────────────────
  btnConnect.addEventListener('click', async () => {
    if (!navigator.bluetooth) {
      log('Web Bluetooth no soportado. Usa Chrome/Edge en escritorio.', 'err');
      return;
    }
    try {
      log('Buscando dispositivo BLE...', 'info');
      setStatus('', 'BUSCANDO...');
      btnConnect.disabled = true;

      device = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }]
      });

      log(`Dispositivo: ${device.name}`, 'info');
      device.addEventListener('gattserverdisconnected', onDisconnected);

      server = await device.gatt.connect();
      log('GATT conectado', 'ok');

      const service = await server.getPrimaryService(SERVICE_UUID);
      log('Servicio BLE encontrado', 'ok');

      // Obtener las 4 características
      for (const [key, uuid] of Object.entries(CHAR_UUIDS)) {
        chars[key] = await service.getCharacteristic(uuid);
        log(`Característica ${key} lista`, 'ok');
      }

      setStatus('connected', 'CONECTADO');
      enableButtons(true);
      log('¡Listo para controlar los motores!', 'ok');

    } catch (err) {
      log(`Error: ${err.message}`, 'err');
      setStatus('error', 'ERROR');
      btnConnect.disabled = false;
    }
  });

  // ── Desconectar ────────────────────────────────────────────
  btnDisconnect.addEventListener('click', async () => {
    // Parar todos los motores antes de desconectar
    for (const key of Object.keys(chars)) {
      try { await writeChar(key, '0'); } catch(_) {}
    }
    if (device && device.gatt.connected) device.gatt.disconnect();
  });

  function onDisconnected() {
    chars = {};
    setStatus('error', 'DESCONECTADO');
    enableButtons(false);
    setMotorUI('a', null);
    setMotorUI('b', null);
    log('Dispositivo desconectado', 'err');
    btnConnect.disabled = false;
  }

  // ── Eventos de botones (mantener pulsado) ────────────────
  motorBtns.forEach(btn => {
    const motor = btn.dataset.motor;
    const dir   = btn.dataset.dir;

    // Capturar el pointer para recibir pointerup aunque el dedo se mueva
    btn.addEventListener('pointerdown', (e) => {
      if (btn.disabled) return;
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      motorPress(motor, dir).catch(err => log(`Error BLE: ${err.message}`, 'err'));
    });

    // Soltar: dedo levantado sobre el botón
    btn.addEventListener('pointerup', (e) => {
      if (btn.disabled) return;
      motorRelease(motor, dir).catch(err => log(`Error BLE: ${err.message}`, 'err'));
    });

    // Soltar: dedo salió del área (con pointer capture llega igualmente)
    btn.addEventListener('pointercancel', (e) => {
      if (btn.disabled) return;
      motorRelease(motor, dir).catch(err => log(`Error BLE: ${err.message}`, 'err'));
    });
  });

  // ── Init log ───────────────────────────────────────────────
  log('Página lista. Pulsa "Conectar" para empezar.', 'info');
  if (!navigator.bluetooth) {
    log('⚠ Web Bluetooth no detectado. Necesitas Chrome o Edge.', 'err');
  }
</script>
</body>
</html>
